name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build Ari EXE
    runs-on: windows-latest
    timeout-minutes: 50
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            VoiceCommand/requirements.txt

      - name: Install dependencies
        run: |
          py -3.11 -m venv VoiceCommand\.venv
          VoiceCommand\.venv\Scripts\python.exe -m pip install --upgrade pip
          VoiceCommand\.venv\Scripts\python.exe -m pip install -r VoiceCommand\requirements.txt
          VoiceCommand\.venv\Scripts\python.exe -m pip install nuitka

      - name: Validate repository
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe validate_repo.py

      - name: Validate decision release (reviewed corpora, release sample floors)
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe -m scripts.decision_data.validate_release --strict-release

      - name: Run decision text acceptance
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe -m scripts.decision_data.acceptance

      - name: Build EXE (Standalone Folder)
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe build_exe.py --clean

      - name: Smoke test bundled decision model
        working-directory: VoiceCommand
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = @("dist\Ari\Ari.exe", "dist\Main.dist\Ari.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "빌드된 실행 파일을 찾지 못했습니다." }
          $report = Join-Path $env:RUNNER_TEMP "decision-self-test.json"
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--decision-self-test", $report) -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force
            throw "판단 모델 자체 검사가 시간 안에 끝나지 않았습니다."
          }
          if (Test-Path $report) { Get-Content $report -Encoding utf8 }
          if ($proc.ExitCode -ne 0) { throw "판단 모델 자체 검사 실패 (exit $($proc.ExitCode))" }

      - name: Zip Artifact
        working-directory: VoiceCommand
        shell: pwsh
        run: |
          $preferred = Join-Path $PWD "dist\Ari"
          $fallback = Join-Path $PWD "dist\Main.dist"
          $sourceDir = $null

          if (Test-Path $preferred) {
            $sourceDir = $preferred
          }
          elseif (Test-Path $fallback) {
            $sourceDir = $fallback
          }
          else {
            Write-Host "dist 디렉터리 내용:"
            Get-ChildItem -Path (Join-Path $PWD "dist") -Recurse -Force -ErrorAction SilentlyContinue
            throw "압축할 빌드 산출물 폴더를 찾지 못했습니다."
          }

          $zipPath = Join-Path (Split-Path $PWD -Parent) "Ari-windows.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path $sourceDir -DestinationPath $zipPath -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Ari-windows-binary
          path: Ari-windows.zip
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: Ari-windows-binary

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: Ari-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
