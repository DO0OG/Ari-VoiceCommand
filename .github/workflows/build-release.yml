name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "VoiceCommand/requirements.txt"
      - "VoiceCommand/build_exe.py"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build Ari EXE
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            VoiceCommand/requirements.txt

      - name: Install dependencies
        run: |
          py -3.11 -m venv VoiceCommand\.venv
          VoiceCommand\.venv\Scripts\python.exe VoiceCommand\install_dependencies.py --no-venv --skip-validate
          VoiceCommand\.venv\Scripts\python.exe -m pip install nuitka

      - name: Validate repository
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe validate_repo.py

      - name: Validate decision release (reviewed corpora, release sample floors)
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe -m scripts.decision_data.validate_release --strict-release

      - name: Run decision text acceptance
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe -m scripts.decision_data.acceptance

      # .mo 파일은 저장소에 포함되지 않으므로 이 단계를 빼면 EXE에 번역이 반영되지 않는다.
      - name: Compile translations
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe scripts\compile_po.py

      - name: Write build info
        id: write-build-info
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          $version = "0.0.0-dev"
          if ($env:REF_TYPE -eq "tag") {
            $candidate = ($env:REF_NAME -replace '^v', '') -replace '[^0-9A-Za-z.\-]', ''
            if ($candidate) { $version = $candidate }
          }

          $channel = "dev"
          if ($env:REF_TYPE -eq "tag") {
            $channel = "stable"
            if ($env:REF_NAME.Contains("-")) { $channel = "beta" }
          }

          $buildInfo = [ordered]@{
            version = $version
            commit = $env:BUILD_COMMIT
            built_at = [DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            channel = $channel
          } | ConvertTo-Json -Compress
          $buildInfoPath = Join-Path $env:GITHUB_WORKSPACE "VoiceCommand\resources\build_info.json"
          [System.IO.Directory]::CreateDirectory((Split-Path $buildInfoPath)) | Out-Null
          [System.IO.File]::WriteAllText(
            $buildInfoPath,
            $buildInfo,
            [System.Text.UTF8Encoding]::new($false)
          )
          $versionOutput = "version=$version" + [Environment]::NewLine
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            $versionOutput,
            [System.Text.UTF8Encoding]::new($false)
          )

      # Nuitka 컴파일 결과를 보존해 다음 빌드에서는 바뀐 모듈만 다시 컴파일한다.
      - name: Read Nuitka version
        id: nuitka-version
        working-directory: VoiceCommand
        shell: pwsh
        run: |
          $version = .venv\Scripts\python.exe -c "import importlib.metadata; print(importlib.metadata.version('Nuitka'))"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore Nuitka compile cache
        id: restore-nuitka-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.nuitka-cache
          key: nuitka-v2-${{ runner.os }}-${{ runner.arch }}-n${{ steps.nuitka-version.outputs.version }}-${{ hashFiles('VoiceCommand/requirements.txt', 'VoiceCommand/build_exe.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-v2-${{ runner.os }}-${{ runner.arch }}-n${{ steps.nuitka-version.outputs.version }}-${{ hashFiles('VoiceCommand/requirements.txt', 'VoiceCommand/build_exe.py') }}-
            nuitka-v2-${{ runner.os }}-${{ runner.arch }}-n${{ steps.nuitka-version.outputs.version }}-

      - name: Build EXE (Standalone Folder)
        id: build-exe
        working-directory: VoiceCommand
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
          CLCACHE_DIR: ${{ github.workspace }}\.nuitka-cache\clcache
        run: .venv\Scripts\python.exe build_exe.py --clean

      - name: Report Nuitka cache size
        if: always() && steps.build-exe.outcome != 'skipped'
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:GITHUB_WORKSPACE ".nuitka-cache"
          if (Test-Path -LiteralPath $cacheRoot -PathType Container) {
            $directories = @(Get-ChildItem -LiteralPath $cacheRoot -Directory -ErrorAction SilentlyContinue)
            if ($directories.Count -eq 0) {
              Write-Output ".nuitka-cache 하위 디렉터리가 없습니다."
            }
            foreach ($directory in $directories) {
              $files = @(Get-ChildItem -LiteralPath $directory.FullName -File -Recurse -ErrorAction SilentlyContinue)
              $bytes = ($files | Measure-Object -Property Length -Sum).Sum
              if ($null -eq $bytes) { $bytes = 0 }
              $mib = [math]::Round($bytes / 1MB, 2)
              Write-Output ("{0}: {1} files, {2} MiB" -f $directory.Name, $files.Count, $mib)
            }
          } else {
            Write-Output ".nuitka-cache 디렉터리가 없습니다."
          }

      # 태그 캐시는 다른 태그에서 재사용할 수 없어 저장하지 않습니다.
      - name: Save Nuitka compile cache
        if: always() && github.ref == 'refs/heads/main' && steps.build-exe.outcome != 'skipped' && steps.restore-nuitka-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.nuitka-cache
          key: ${{ steps.restore-nuitka-cache.outputs.cache-primary-key }}

      - name: Smoke test bundled Whisper worker IPC (no model or audio device)
        working-directory: VoiceCommand
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = @("dist\Ari\Ari.exe", "dist\Main.dist\Ari.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "EXE not found in build output." }
          $report = Join-Path $env:RUNNER_TEMP "whisper-worker-self-test.json"
          if (Test-Path $report) { Remove-Item -LiteralPath $report -Force }
          $quotedReport = '"' + $report + '"'
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--ari-whisper-worker-self-test", "ko", $quotedReport) -WindowStyle Hidden -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(45000)) {
            taskkill /PID $proc.Id /T /F | Out-Null
            throw "Whisper worker IPC self-test timed out."
          }
          if (-not (Test-Path $report)) { throw "Whisper worker IPC self-test did not write its report." }
          $result = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or -not $result.ok -or $result.scope -ne "worker_ipc_only" -or $result.language -ne "ko") {
            throw "Bundled Whisper worker IPC self-test failed or returned an invalid scope report."
          }
          Write-Output "Whisper worker IPC self-test passed: scope=$($result.scope), language=$($result.language). No model transcription was tested."

      - name: Smoke test bundled dependency imports
        working-directory: VoiceCommand
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = @("dist\Ari\Ari.exe", "dist\Main.dist\Ari.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "EXE not found in build output." }
          $report = Join-Path $env:RUNNER_TEMP "bundle-import-self-test.json"
          $quotedReport = '"' + $report + '"'
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--bundle-import-self-test", $quotedReport) -WindowStyle Hidden -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Bundled dependency import self-test timed out."
          }
          if (-not (Test-Path $report)) { throw "Bundled dependency import self-test did not write its report." }
          $result = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or -not $result.ok) { throw "Bundled dependency import self-test failed: $($result | ConvertTo-Json -Depth 8)" }
          Write-Output "Bundled dependency import self-test passed."

      - name: Smoke test bundled decision model and translations
        working-directory: VoiceCommand
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = @("dist\Ari\Ari.exe", "dist\Main.dist\Ari.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "빌드된 실행 파일을 찾지 못했습니다." }
          $report = Join-Path $env:RUNNER_TEMP "decision-self-test.json"
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--decision-self-test", $report) -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force
            throw "판단 모델 자체 검사가 시간 안에 끝나지 않았습니다."
          }
          if (Test-Path $report) { Get-Content $report -Encoding utf8 }
          if ($proc.ExitCode -ne 0) { throw "판단 모델 자체 검사 실패 (exit $($proc.ExitCode))" }

      # 릴리스에는 빌드 폴더 압축본 대신 설치 파일 하나만 올린다.
      - name: Build installer
        working-directory: VoiceCommand
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.write-build-info.outputs.version }}
        run: |
          $sourceDir = @("dist\Ari", "dist\Main.dist") | Where-Object { Test-Path "$_\Ari.exe" } | Select-Object -First 1
          if (-not $sourceDir) {
            Write-Host "dist 디렉터리 내용:"
            Get-ChildItem -Path (Join-Path $PWD "dist") -Recurse -Force -ErrorAction SilentlyContinue
            throw "설치 파일에 넣을 빌드 산출물 폴더를 찾지 못했습니다."
          }

          $version = $env:APP_VERSION

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 설치에 실패했습니다." }
          }
          & $iscc "/DAppVersion=$version" "/DBuildDir=$(Resolve-Path $sourceDir)" installer\Ari.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일 빌드에 실패했습니다 (exit $LASTEXITCODE)." }

          $setup = "dist\installer\Ari-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "설치 파일이 만들어지지 않았습니다: $setup" }
          Copy-Item $setup (Split-Path $PWD -Parent) -Force

      - name: Create and validate release manifest
        if: github.ref_type == 'tag'
        working-directory: VoiceCommand
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.write-build-info.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: .venv\Scripts\python.exe -m scripts.release_manifest --installer "..\Ari-Setup-$($env:APP_VERSION).exe" --version $env:APP_VERSION --tag $env:RELEASE_TAG --repository $env:RELEASE_REPOSITORY --output-dir ..

      - name: Smoke test installer (install, self-test, uninstall)
        shell: pwsh
        timeout-minutes: 8
        env:
          EXPECTED_VERSION: ${{ steps.write-build-info.outputs.version }}
        run: |
          $setup = Get-ChildItem "Ari-Setup-*.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "AriInstall"
          $proc = Start-Process $setup.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "설치에 실패했습니다 (exit $($proc.ExitCode))." }
          if (-not (Test-Path "$dir\Ari.exe")) { throw "설치 폴더에 Ari.exe가 없습니다." }

          # 콘솔 없는 GUI 실행 파일이라 직접 호출하면 표준 출력이 연결되지 않는다. 파일로 받아 읽는다.
          $versionOut = Join-Path $env:RUNNER_TEMP "installed-version.txt"
          $versionProc = Start-Process "$dir\Ari.exe" -ArgumentList "--version" -RedirectStandardOutput $versionOut -NoNewWindow -Wait -PassThru
          $reportedVersion = if (Test-Path $versionOut) { (Get-Content $versionOut -Raw).Trim() } else { "" }
          if ($versionProc.ExitCode -ne 0 -or $reportedVersion -ne $env:EXPECTED_VERSION) {
            throw "Installed version mismatch: expected $env:EXPECTED_VERSION, got $reportedVersion"
          }
          if ($env:EXPECTED_VERSION -match '^(\d+)\.(\d+)\.(\d+)(?:-.*)?$') {
            $expectedFileVersion = "$($matches[1]).$($matches[2]).$($matches[3]).0"
            $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$dir\Ari.exe")
            $fileVersionMatches = $versionInfo.FileVersion -eq $expectedFileVersion
            $productVersionMatches = $versionInfo.ProductVersion -eq $expectedFileVersion
            if (-not $fileVersionMatches -or -not $productVersionMatches) {
              throw "Installed PE version metadata does not match $expectedFileVersion."
            }
          }

          $report = Join-Path $env:RUNNER_TEMP "installed-decision-self-test.json"
          $test = Start-Process "$dir\Ari.exe" -ArgumentList @("--decision-self-test", $report) -PassThru
          $null = $test.Handle
          if (-not $test.WaitForExit(180000)) {
            Stop-Process -Id $test.Id -Force
            throw "설치본 자체 검사가 시간 안에 끝나지 않았습니다."
          }
          if (Test-Path $report) { Get-Content $report -Encoding utf8 }
          if ($test.ExitCode -ne 0) { throw "설치본 자체 검사 실패 (exit $($test.ExitCode))" }

          $bundleReport = Join-Path $env:RUNNER_TEMP "installed-bundle-import-self-test.json"
          $quotedBundleReport = '"' + $bundleReport + '"'
          $bundleTest = Start-Process "$dir\Ari.exe" -ArgumentList @("--bundle-import-self-test", $quotedBundleReport) -WindowStyle Hidden -PassThru
          $null = $bundleTest.Handle
          if (-not $bundleTest.WaitForExit(180000)) {
            Stop-Process -Id $bundleTest.Id -Force
            throw "Installed dependency import self-test timed out."
          }
          if (-not (Test-Path $bundleReport)) { throw "Installed dependency import self-test did not write its report." }
          $bundleResult = Get-Content -Raw -Encoding utf8 $bundleReport | ConvertFrom-Json
          if ($bundleTest.ExitCode -ne 0 -or -not $bundleResult.ok) { throw "Installed dependency import self-test failed: $($bundleResult | ConvertTo-Json -Depth 8)" }

          # 설치 GUI가 이벤트 루프를 유지하는지 확인한다.
          $smokeProfileName = "AriSmokeProfile-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $smokeProfile = Join-Path $env:RUNNER_TEMP $smokeProfileName
          $appData = Join-Path $smokeProfile "Roaming"
          $ariData = Join-Path $appData "Ari"
          New-Item -ItemType Directory -Path $ariData -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $ariData ".cosyvoice_asked") -Force | Out-Null
          $smokeRun = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $smokeReport = Join-Path $env:RUNNER_TEMP "installed-gui-smoke-$smokeRun.json"
          $smokeStderr = Join-Path $env:RUNNER_TEMP "installed-gui-smoke-$smokeRun.stderr.log"
          $previousAppData = $env:APPDATA
          $previousAppDataOverride = $env:ARI_APP_DATA_DIR
          $env:APPDATA = $appData
          Remove-Item Env:ARI_APP_DATA_DIR -ErrorAction SilentlyContinue
          $env:ARI_SMOKE_SECONDS = "65"
          $env:ARI_SMOKE_REPORT = $smokeReport
          $smokePattern = '\b(ERROR|CRITICAL)\b|Traceback|Fatal Python error|Exception ignored'
          try {
            $startSmoke = @{
              FilePath = "$dir\Ari.exe"
              WindowStyle = "Hidden"
              RedirectStandardError = $smokeStderr
              PassThru = $true
            }
            $smoke = Start-Process @startSmoke
            $null = $smoke.Handle
            if (-not $smoke.WaitForExit(180000)) {
              & taskkill.exe /PID $smoke.Id /T /F | Out-Null
              $null = $smoke.WaitForExit(30000)
              throw "Installed GUI smoke test timed out."
            }
            $smoke.Refresh()
            if (-not (Test-Path $smokeReport)) {
              throw "Installed GUI smoke test did not write its report."
            }
            $smokeResult = Get-Content -Raw -Encoding utf8 $smokeReport | ConvertFrom-Json
            if (
              $smoke.ExitCode -ne 0 -or -not $smokeResult.gui_ready -or
              -not $smokeResult.clean_exit -or $smokeResult.heartbeat_count -lt 60 -or
              $smokeResult.error_count -ne 0
            ) {
              $smokeDetails = $smokeResult | ConvertTo-Json -Depth 8
              throw "Installed GUI smoke test returned an invalid report: $smokeDetails"
            }
            $appLogDir = Join-Path $ariData "logs"
            $appLogs = @(
              Get-ChildItem -Path $appLogDir -Filter "ari_log_*.log" -File `
                -ErrorAction SilentlyContinue
            )
            if (-not $appLogs) { throw "Installed GUI smoke test did not create an app log." }
            foreach ($appLog in $appLogs) {
              if (Select-String -Path $appLog.FullName -Pattern $smokePattern) {
                throw "Installed GUI smoke log contains an error: $($appLog.Name)"
              }
            }
            if (Test-Path $smokeStderr) {
              if (Select-String -Path $smokeStderr -Pattern $smokePattern) {
                throw "Installed GUI smoke stderr contains an error."
              }
            }
            Write-Output (
              "Installed GUI smoke test passed: {0} heartbeats in {1} seconds." -f
                $smokeResult.heartbeat_count, $smokeResult.observed_seconds
            )
          } catch {
            Write-Output "Installed GUI smoke test failed: $_"
            if (Test-Path $smokeReport) { Get-Content -Raw -Encoding utf8 $smokeReport }
            if (Test-Path $smokeStderr) { Get-Content -Raw -Encoding utf8 $smokeStderr }
            $failureLogs = @(
              Get-ChildItem -Path (Join-Path $ariData "logs") `
                -Filter "ari_log_*.log" -File -ErrorAction SilentlyContinue
            )
            foreach ($failureLog in $failureLogs) {
              Write-Output "--- $($failureLog.FullName) ---"
              Get-Content -Raw -Encoding utf8 $failureLog.FullName
            }
            throw
          } finally {
            Remove-Item Env:ARI_SMOKE_SECONDS -ErrorAction SilentlyContinue
            Remove-Item Env:ARI_SMOKE_REPORT -ErrorAction SilentlyContinue
            if ($null -ne $previousAppData) { $env:APPDATA = $previousAppData }
            else { Remove-Item Env:APPDATA -ErrorAction SilentlyContinue }
            if ($null -ne $previousAppDataOverride) {
              $env:ARI_APP_DATA_DIR = $previousAppDataOverride
            }
            else { Remove-Item Env:ARI_APP_DATA_DIR -ErrorAction SilentlyContinue }
          }

          # 자율 실행 파이썬 코드는 설치된 실행 파일의 숨은 워커 모드로 돈다.
          $script = Join-Path $env:RUNNER_TEMP "ari-script-smoke.py"
          Set-Content -Path $script -Encoding utf8 -Value @(
            "import io",
            "import webbrowser",
            "import pandas as pd",
            "from openpyxl import load_workbook",
            "from matplotlib.backends.backend_agg import FigureCanvasAgg",
            "from matplotlib.figure import Figure",
            "from reportlab.pdfgen.canvas import Canvas",
            "from agent.automation_helpers import AutomationHelpers",
            "xlsx = io.BytesIO()",
            "pd.DataFrame({'value': [7, 11]}).to_excel(xlsx, index=False, engine='openpyxl')",
            "xlsx.seek(0)",
            "workbook = load_workbook(xlsx, read_only=True, data_only=True)",
            "assert workbook.active['A2'].value == 7",
            "workbook.close()",
            "figure = Figure(figsize=(1, 1))",
            "FigureCanvasAgg(figure)",
            "figure.subplots().plot([0, 1], [7, 11])",
            "png = io.BytesIO()",
            "figure.savefig(png, format='png')",
            "assert png.getvalue().startswith(b'\x89PNG')",
            "pdf = io.BytesIO()",
            "document = Canvas(pdf)",
            "document.drawString(10, 10, 'Ari release test')",
            "document.save()",
            "assert pdf.getvalue().startswith(b'%PDF')",
            "print('ari-script-smoke-ok')"
          )
          $scriptOut = Join-Path $env:RUNNER_TEMP "ari-script-smoke.out"
          $run = Start-Process "$dir\Ari.exe" -ArgumentList @("--ari-run-python-script", "`"$script`"") -RedirectStandardOutput $scriptOut -WindowStyle Hidden -PassThru
          $null = $run.Handle
          if (-not $run.WaitForExit(60000)) {
            Stop-Process -Id $run.Id -Force
            throw "설치본 스크립트 실행이 시간 안에 끝나지 않았습니다."
          }
          $printed = Get-Content -Raw -Encoding utf8 $scriptOut
          if ($run.ExitCode -ne 0 -or $printed -notmatch "ari-script-smoke-ok") {
            throw "설치본 스크립트 실행 실패 (exit $($run.ExitCode)): $printed"
          }
          Write-Output "Installed script package smoke test passed: pandas/openpyxl, matplotlib PNG, reportlab PDF."

          # Program Files에는 쓸 수 없으므로 사용자 데이터가 설치 폴더에 생기면 안 된다.
          if (Test-Path "$dir\.ari_runtime") { throw "설치 폴더에 사용자 데이터 폴더가 생겼습니다." }

          $uninstall = Start-Process "$dir\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "제거에 실패했습니다 (exit $($uninstall.ExitCode))." }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Ari-windows-installer
          path: |
            Ari-Setup-*.exe
            update.json
            update-beta.json
            SHA256SUMS.txt
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: Ari-windows-installer

      - name: Select release assets
        id: select-release-assets
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            manifest="update-beta.json"
          else
            manifest="update.json"
          fi
          installer="$(jq -er '.installer.name' "$manifest")"
          for file in "$installer" "$manifest" "SHA256SUMS.txt"; do
            if [[ ! -f "$file" ]]; then
              echo "Required release asset not found: $file" >&2
              exit 1
            fi
          done
          {
            echo 'files<<EOF'
            printf '%s\n' "$installer" "$manifest" "SHA256SUMS.txt"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: ${{ steps.select-release-assets.outputs.files }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish beta channel manifest
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view beta-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create beta-channel --repo "$GITHUB_REPOSITORY" --title "Ari Beta Channel" --notes "Beta-channel manifest asset." --prerelease --target "$GITHUB_SHA" --latest=false
          fi
          gh release edit beta-channel --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          gh release upload beta-channel update-beta.json --repo "$GITHUB_REPOSITORY" --clobber
