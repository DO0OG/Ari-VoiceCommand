name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build Ari EXE
    runs-on: windows-latest
    timeout-minutes: 50
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            VoiceCommand/requirements.txt

      - name: Install dependencies
        run: |
          py -3.11 -m venv VoiceCommand\.venv
          VoiceCommand\.venv\Scripts\python.exe -m pip install --upgrade pip
          VoiceCommand\.venv\Scripts\python.exe -m pip install -r VoiceCommand\requirements.txt
          VoiceCommand\.venv\Scripts\python.exe -m pip install nuitka

      - name: Validate repository
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe validate_repo.py

      - name: Validate decision release (reviewed corpora, release sample floors)
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe -m scripts.decision_data.validate_release --strict-release

      - name: Run decision text acceptance
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe -m scripts.decision_data.acceptance

      # .mo 파일은 저장소에 포함되지 않으므로 이 단계를 빼면 EXE에 번역이 반영되지 않는다.
      - name: Compile translations
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe scripts\compile_po.py

      - name: Build EXE (Standalone Folder)
        working-directory: VoiceCommand
        run: .venv\Scripts\python.exe build_exe.py --clean

      - name: Smoke test bundled Whisper worker IPC (no model or audio device)
        working-directory: VoiceCommand
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = @("dist\Ari\Ari.exe", "dist\Main.dist\Ari.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "EXE not found in build output." }
          $report = Join-Path $env:RUNNER_TEMP "whisper-worker-self-test.json"
          if (Test-Path $report) { Remove-Item -LiteralPath $report -Force }
          $quotedReport = '"' + $report + '"'
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--ari-whisper-worker-self-test", "ko", $quotedReport) -WindowStyle Hidden -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(45000)) {
            taskkill /PID $proc.Id /T /F | Out-Null
            throw "Whisper worker IPC self-test timed out."
          }
          if (-not (Test-Path $report)) { throw "Whisper worker IPC self-test did not write its report." }
          $result = Get-Content -Raw -Encoding utf8 $report | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or -not $result.ok -or $result.scope -ne "worker_ipc_only" -or $result.language -ne "ko") {
            throw "Bundled Whisper worker IPC self-test failed or returned an invalid scope report."
          }
          Write-Output "Whisper worker IPC self-test passed: scope=$($result.scope), language=$($result.language). No model transcription was tested."

      - name: Smoke test bundled decision model and translations
        working-directory: VoiceCommand
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = @("dist\Ari\Ari.exe", "dist\Main.dist\Ari.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "빌드된 실행 파일을 찾지 못했습니다." }
          $report = Join-Path $env:RUNNER_TEMP "decision-self-test.json"
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @("--decision-self-test", $report) -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force
            throw "판단 모델 자체 검사가 시간 안에 끝나지 않았습니다."
          }
          if (Test-Path $report) { Get-Content $report -Encoding utf8 }
          if ($proc.ExitCode -ne 0) { throw "판단 모델 자체 검사 실패 (exit $($proc.ExitCode))" }

      # 릴리스에는 빌드 폴더 압축본 대신 설치 파일 하나만 올린다.
      - name: Build installer
        working-directory: VoiceCommand
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $sourceDir = @("dist\Ari", "dist\Main.dist") | Where-Object { Test-Path "$_\Ari.exe" } | Select-Object -First 1
          if (-not $sourceDir) {
            Write-Host "dist 디렉터리 내용:"
            Get-ChildItem -Path (Join-Path $PWD "dist") -Recurse -Force -ErrorAction SilentlyContinue
            throw "설치 파일에 넣을 빌드 산출물 폴더를 찾지 못했습니다."
          }

          $version = "0.0.0-dev"
          if ($env:REF_TYPE -eq "tag") {
            $candidate = ($env:REF_NAME -replace '^v', '') -replace '[^0-9A-Za-z.\-]', ''
            if ($candidate) { $version = $candidate }
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 설치에 실패했습니다." }
          }
          & $iscc "/DAppVersion=$version" "/DBuildDir=$(Resolve-Path $sourceDir)" installer\Ari.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일 빌드에 실패했습니다 (exit $LASTEXITCODE)." }

          $setup = "dist\installer\Ari-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "설치 파일이 만들어지지 않았습니다: $setup" }
          Copy-Item $setup (Split-Path $PWD -Parent) -Force

      - name: Smoke test installer (install, self-test, uninstall)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $setup = Get-ChildItem "Ari-Setup-*.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "AriInstall"
          $proc = Start-Process $setup.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "설치에 실패했습니다 (exit $($proc.ExitCode))." }
          if (-not (Test-Path "$dir\Ari.exe")) { throw "설치 폴더에 Ari.exe가 없습니다." }

          $report = Join-Path $env:RUNNER_TEMP "installed-decision-self-test.json"
          $test = Start-Process "$dir\Ari.exe" -ArgumentList @("--decision-self-test", $report) -PassThru
          $null = $test.Handle
          if (-not $test.WaitForExit(180000)) {
            Stop-Process -Id $test.Id -Force
            throw "설치본 자체 검사가 시간 안에 끝나지 않았습니다."
          }
          if (Test-Path $report) { Get-Content $report -Encoding utf8 }
          if ($test.ExitCode -ne 0) { throw "설치본 자체 검사 실패 (exit $($test.ExitCode))" }

          # 자율 실행 파이썬 코드는 설치된 실행 파일의 숨은 워커 모드로 돈다.
          $script = Join-Path $env:RUNNER_TEMP "ari-script-smoke.py"
          Set-Content -Path $script -Encoding utf8 -Value @(
            "import webbrowser",
            "from agent.automation_helpers import AutomationHelpers",
            "print('스크립트 실행 확인')"
          )
          $scriptOut = Join-Path $env:RUNNER_TEMP "ari-script-smoke.out"
          $run = Start-Process "$dir\Ari.exe" -ArgumentList @("--ari-run-python-script", "`"$script`"") -RedirectStandardOutput $scriptOut -PassThru
          $null = $run.Handle
          if (-not $run.WaitForExit(60000)) {
            Stop-Process -Id $run.Id -Force
            throw "설치본 스크립트 실행이 시간 안에 끝나지 않았습니다."
          }
          $printed = Get-Content -Raw -Encoding utf8 $scriptOut
          if ($run.ExitCode -ne 0 -or $printed -notmatch "스크립트 실행 확인") {
            throw "설치본 스크립트 실행 실패 (exit $($run.ExitCode)): $printed"
          }

          # Program Files에는 쓸 수 없으므로 사용자 데이터가 설치 폴더에 생기면 안 된다.
          if (Test-Path "$dir\.ari_runtime") { throw "설치 폴더에 사용자 데이터 폴더가 생겼습니다." }

          $uninstall = Start-Process "$dir\unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "제거에 실패했습니다 (exit $($uninstall.ExitCode))." }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Ari-windows-installer
          path: Ari-Setup-*.exe
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: Ari-windows-installer

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: Ari-Setup-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
